# Load Balancer: Sideboard Configurator Service

upstream configurator-service {
    server configurator-service:3003;
    # server configurator-service-2:3003;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://configurator-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 60s;
    }
}
