# Load Balancer: Sideboard Manufacturer Service Backend
# Sits between the frontend and the Sideboard Manufacturer Service Backend.
# Add more servers to the upstream block to enable real load balancing.

upstream sideboard-manufacturer-backend {
    server sideboard-manufacturer-backend:5000;
    # server sideboard-manufacturer-backend-2:5000;  # scale: add more instances
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://sideboard-manufacturer-backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 60s;
    }
}
