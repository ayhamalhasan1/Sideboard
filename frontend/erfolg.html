<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | Bestellung Erfolgreich</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div style="text-align: center; max-width: 600px; margin: 4rem auto; background: var(--white); padding: 3rem; border-radius: 4px; border: 1px solid var(--border);">
      <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
      <h1 style="margin-bottom: 1rem; color: var(--ikea-blue);">Danke für deine Bestellung!</h1>
      <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem;">
        Deine Bestellung wurde erfolgreich entgegengenommen. Wir prüfen nun die Verfügbarkeit der Teile in deinem lokalen Einrichtungshaus und bereiten den Versand vor.
      </p>
      
      <div style="background: var(--bg-light); padding: 1.5rem; border-radius: 4px; margin-bottom: 2rem;">
        <p style="font-weight: 700; margin-bottom: 0.5rem;">Bestellnummer:</p>
        <p style="font-family: monospace; font-size: 1.2rem; color: var(--text-dark);">
          <script>
            const urlParams = new URLSearchParams(window.location.search);
            const orderNr = urlParams.get('order') || 'ORD-' + (Math.floor(Math.random() * 900000) + 100000);
            document.write(orderNr);
          </script>
        </p>
      </div>
      
      <a href="index.html" class="btn-primary" style="display: inline-block; text-decoration: none;">
        Zurück zur Startseite
      </a>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
