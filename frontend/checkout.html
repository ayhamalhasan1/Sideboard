<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | Kasse</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-form {
      background: var(--bg-white);
      padding: 2.5rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      max-width: 600px;
      margin: 0 auto;
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    
    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: var(--ikea-blue);
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <div style="margin-bottom: 2rem;">
      <a href="warenkorb.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück zum Warenkorb</a>
    </div>

    <h1 class="page-title" style="text-align: center;">Kasse</h1>

    <div class="checkout-form">
      <h2 style="margin-bottom: 2rem;">Lieferadresse</h2>
      
      <form id="checkoutForm">
        <div class="form-row">
          <div class="form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" required placeholder="z.B. Max">
          </div>
          <div class="form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" required placeholder="z.B. Mustermann">
          </div>
        </div>
        
        <div class="form-group">
          <label for="adresse">Straße und Hausnummer</label>
          <input type="text" id="adresse" required placeholder="Musterstraße 1">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="plz">PLZ</label>
            <input type="text" id="plz" required placeholder="12345">
          </div>
          <div class="form-group">
            <label for="stadt">Stadt</label>
            <input type="text" id="stadt" required placeholder="Berlin">
          </div>
        </div>
        
        <hr style="border: none; border-top: 1px solid var(--border); margin: 2rem 0;">
        
        <h2 style="margin-bottom: 1.5rem;">Zahlung</h2>
        <div style="background: var(--bg-light); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 2rem; border: 1px solid var(--border);">
          <p style="font-weight: 700; margin-bottom: 0.5rem;">Zahlung auf Rechnung (Demo / Stripe-Mock)</p>
          <p style="color: var(--text-muted); font-size: 0.9rem;">Die Rechnung wird nach der Lieferung separat verschickt.</p>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1.2rem;">
          Jetzt zahlungspflichtig bestellen
        </button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      try {
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.textContent = "Verarbeite Bestellung...";

        const address = {
          vorname: document.getElementById('vorname').value,
          nachname: document.getElementById('nachname').value,
          adresse: document.getElementById('adresse').value,
          plz: document.getElementById('plz').value,
          stadt: document.getElementById('stadt').value
        };

        const res = await fetch(`${window.API}/cart/checkout`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ shipping_address: address })
        });

        const data = await res.json();

        if (res.ok) {
          // Zeige Erfolgsmeldung direkt auf der Seite
          document.querySelector('.checkout-form').innerHTML = `
            <div style="text-align: center; padding: 2rem 0;">
              <div style="font-size: 4rem; margin-bottom: 1rem;">🎉</div>
              <h2 style="color: var(--ikea-blue); margin-bottom: 1rem;">Danke für deine Bestellung!</h2>
              <p style="color: var(--text-muted); margin-bottom: 2rem;">Wir haben deine Bestellung <strong>#${data.order_number}</strong> erhalten.</p>
              <button onclick="window.location.href='index.html'" class="btn-primary">Zurück zur Startseite</button>
            </div>
          `;
        } else {
          showToast(data.fehler || "Es gab ein Problem.", true);
          btn.disabled = false;
          btn.textContent = "Jetzt zahlungspflichtig bestellen";
        }
      } catch (err) {
        showToast("Netzwerkfehler beim Checkout", true);
      }
    });


  </script>
</body>
</html>
