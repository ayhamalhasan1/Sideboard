# nginx.conf — Sideboard Manufacturer Service (Frontend)
# Serves static HTML5 app and proxies /api/* through the Manufacturer Load Balancer
# → Sideboard Manufacturer Service Backend → API Gateway

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Serve static frontend files with no-cache for instant development updates
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Proxy API calls: Frontend → lb-manufacturer → Sideboard Manufacturer Backend → API Gateway
    location /api {
        resolver 127.0.0.11 valid=5s;
        set $backend "http://lb-manufacturer:80";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
    }
}
