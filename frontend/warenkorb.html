<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | Warenkorb</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div style="margin-bottom: 2rem;">
      <a href="shop.html" style="color: var(--text-muted); text-decoration: none;">&larr; Weiter einkaufen</a>
    </div>

    <h1 class="page-title">Warenkorb</h1>

    <div class="cart-layout" id="cartLayout">
      <!-- Items List -->
      <ul class="cart-items" id="cartList"></ul>

      <!-- Summary Sidebar -->
      <div class="cart-summary" id="cartSummary" style="display: none;">
        <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Bestellübersicht</h2>
        
        <div class="summary-row">
          <span style="color: var(--text-muted);">Artikel</span>
          <span id="summaryCount">0</span>
        </div>
        <div class="summary-row">
          <span style="color: var(--text-muted);">Lieferung</span>
          <span>Kostenlos</span>
        </div>
        
        <div class="summary-total">
          <span>Gesamt</span>
          <span id="summaryTotal">0,00 €</span>
        </div>

        <button class="btn-primary" style="width: 100%; margin-top: 2rem;" onclick="window.location.href='checkout.html'">
          Zur Kasse gehen
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadWarenkorb() {
      try {
        const res = await fetch(`${API}/shop/cart`, { credentials: "include" });
        if (!res.ok) throw new Error("API error");
        const items = await res.json();

        const list = document.getElementById("cartList");
        const summary = document.getElementById("cartSummary");

        if (items.length === 0) {
          list.innerHTML = `
            <div class="cart-empty">
              <h3 style="margin-bottom: 1rem;">Dein Warenkorb ist leer</h3>
              <a href="shop.html" class="btn-secondary">Zum Shop</a>
            </div>
          `;
          summary.style.display = "none";
          return;
        }

        let total = 0;
        let itemSum = 0;
        list.innerHTML = "";

        items.forEach(item => {
          const preis = Number(item.preis) * item.menge;
          total += preis;
          itemSum += item.menge;
          
          list.innerHTML += `
            <li class="cart-item">
              <img class="cart-item-img" src="${item.bild_url}" alt="${item.name}"
                   onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 120%22><rect fill=%22%23F5F5F5%22 width=%22120%22 height=%22120%22/></svg>'">
              
              <div class="cart-item-details">
                <div class="cart-item-title">${item.name}</div>
                <div style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.2rem;">Artikelnr: ${item.id}000</div>
                
                <div class="cart-item-actions" style="display: flex; align-items: center; gap: 0.5rem;">
                  <input type="number" min="1" value="${item.menge}" onchange="updateQuantity('${item.id}', this.value)" style="width: 60px; padding: 0.2rem; border: 1px solid var(--border); border-radius: 4px;" ${item.id === 'sideboard' ? 'disabled title="Menge fest"' : ''}>
                  <button class="btn-icon-only" onclick="removeFromCart('${item.id}')" title="Entfernen">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6"/></svg>
                  </button>
                </div>
              </div>
              
              <div class="cart-item-price">
                ${preis.toFixed(2).replace('.', ',')} €
              </div>
            </li>
          `;
        });

        document.getElementById("summaryCount").textContent = itemSum;
        document.getElementById("summaryTotal").textContent = total.toFixed(2).replace('.', ',') + " €";
        summary.style.display = "block";
        
      } catch (err) {
        document.getElementById("cartList").innerHTML = `<p class="error">Warenkorb konnte nicht geladen werden.</p>`;
      }
    }

    async function removeFromCart(itemId) {
      try {
        await fetch(`${API}/shop/cart/${itemId}`, { method: "DELETE", credentials: "include" });
        showToast("Artikel entfernt");
        loadWarenkorb();
        updateCartBadge();
      } catch (err) {
        showToast("Fehler", true);
      }
    }

    async function updateQuantity(itemId, newMenge) {
      if(itemId === 'sideboard') return;
      try {
        await fetch(`${API}/shop/cart/${itemId}`, { 
          method: "PUT", 
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ menge: parseInt(newMenge, 10) })
        });
        loadWarenkorb();
        updateCartBadge();
      } catch (err) {
        showToast("Fehler", true);
      }
    }

    // Assign to window so app.js can call it
    window.loadWarenkorb = loadWarenkorb;

    document.addEventListener("DOMContentLoaded", () => {
      loadWarenkorb();
    });
  </script>
</body>
</html>
