<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sideboard Konfigurator | Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div style="margin-bottom: 2rem;">
      <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Zurück</a>
    </div>

    <h1 class="page-title">Zubehör-Shop</h1>
    
    <div class="shop-grid" id="zubehoerGrid">
      <p style="color: var(--text-muted);">Lade Zubehör...</p>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function loadShop() {
      try {
        const res = await fetch(`${API}/shop/accessories`, { credentials: "include" });
        if (!res.ok) throw new Error("API error");
        const teile = await res.json();
        
        const grid = document.getElementById("zubehoerGrid");
        grid.innerHTML = "";

        teile.forEach(teil => {
          // Format price
          const formattedPrice = Number(teil.preis).toFixed(2).split('.');
          
          grid.innerHTML += `
            <div class="product-card">
              <img class="product-image" src="${teil.bild_url}" alt="${teil.name}">
              <h3 class="product-name">${teil.name}</h3>
              <p class="product-desc">${teil.beschreibung || 'Passendes Zubehör für dein Sideboard.'}</p>
              <div class="product-price">
                ${formattedPrice[0]}<small>,${formattedPrice[1]} €</small>
              </div>
              <button class="btn-secondary btn-add-cart" onclick="addToCart(${teil.id})">
                In den Warenkorb
              </button>
            </div>
          `;
        });
      } catch (err) {
        document.getElementById("zubehoerGrid").innerHTML = 
          `<p style="color: var(--red);">Fehler beim Laden des Shops.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadShop();
    });
  </script>
</body>
</html>
