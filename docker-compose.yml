# docker-compose.yml – Startet alle Services für den Sideboard-Konfigurator

services:
  # MySQL-Datenbank
  mysql:
    image: mysql:8.0
    container_name: sideboard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      MYSQL_DATABASE: sideboard_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sideboard123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis für Sessions und KI-Cache
  redis:
    image: redis:7-alpine
    container_name: sideboard-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Node.js Backend
  backend:
    build: ./backend
    container_name: sideboard-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # MinIO S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: sideboard-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Init – Initialisiert Buckets und lädt Assets hoch
  minio-init:
    build: ./backend/minio-init
    container_name: sideboard-minio-init
    volumes:
      - ./assets:/assets:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Nginx Frontend
  frontend:
    build: ./frontend
    container_name: sideboard-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    environment:
      MINIO_URL: http://minio:9000
      MINIO_BUCKET: sideboard
    depends_on:
      - backend
      - minio

volumes:
  mysql_data:
  minio_data:
