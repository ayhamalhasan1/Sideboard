# docker-compose.yml
# Default Microservices architecture for the Sideboard Konfigurator
#
# Usage:
#   docker compose up --build
#
# To scale a service (demonstrates load balancer round-robin):
#   docker compose up --build --scale cart-service=3
#
# To enable Elasticsearch or Neo4j: uncomment the relevant service blocks below.

services:

  # ════════════════════════════════════════════════════════════
  # INFRASTRUCTURE
  # ════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: sideboard-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      MYSQL_DATABASE: sideboard_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sideboard123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sideboard-redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sideboard-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    build: ./infrastructure/minio-init
    container_name: sideboard-minio-init
    volumes:
      - ./assets:/assets:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  
  # ════════════════════════════════════════════════════════════
  # MICROSERVICES
  # ════════════════════════════════════════════════════════════

  shop-service:
    build: ./services/shop-service
    container_name: sideboard-shop
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
      # ES_HOST: elasticsearch   # Uncomment when elasticsearch service is enabled
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cart-service:
    build: ./services/cart-service
    container_name: sideboard-cart
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  configurator-service:
    build: ./services/configurator-service
    container_name: sideboard-configurator
    restart: always
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      # SQL DB 1 — Car Configurator Service (active configurations)
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      # SQL DB 2 — Sideboard-Konfigurator DB (saved sideboards)
      # Points to same instance in dev; change host/name for separate DB in prod
      DB_SAVED_HOST: mysql
      DB_SAVED_USER: root
      DB_SAVED_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_SAVED_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  media-service:
    build: ./services/media-service
    container_name: sideboard-media
    restart: always
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: sideboard
    depends_on:
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy

  ai-recommendation-service:
    build: ./services/ai-service
    container_name: sideboard-ai
    restart: always
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # NEO4J_URI: bolt://neo4j:7687    # Uncomment when neo4j service is enabled
      # NEO4J_USER: neo4j
      # NEO4J_PASSWORD: password
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  community-feature-service:
    build: ./services/community-feature-service
    container_name: sideboard-community
    restart: always
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sideboard123}
      DB_NAME: sideboard_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: sideboard
      SESSION_SECRET: ${SESSION_SECRET:-mein-geheimes-session-secret}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ════════════════════════════════════════════════════════════
  # API GATEWAY  (Routing Gateway to service load balancers)
  # ════════════════════════════════════════════════════════════

  api-gateway:
    build: ./services/api-gateway
    container_name: sideboard-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      LB_SHOP_URL:         http://lb-shop:80
      LB_CART_URL:         http://lb-cart:80
      LB_CONFIGURATOR_URL: http://lb-configurator:80
      LB_MEDIA_URL:        http://lb-media:80
      LB_AI_URL:           http://lb-ai:80
      LB_COMMUNITY_URL:    http://lb-community:80
    depends_on:
      - lb-shop
      - lb-cart
      - lb-configurator
      - lb-media
      - lb-ai
      - lb-community

  # ════════════════════════════════════════════════════════════
  # SIDEBOARD MANUFACTURER SERVICE — BACKEND (BFF)
  # ════════════════════════════════════════════════════════════

  sideboard-manufacturer-backend:
    build: ./services/sideboard-manufacturer-backend
    container_name: sideboard-manufacturer-backend
    restart: always
    environment:
      PORT: 5000
      API_GATEWAY_URL: http://api-gateway:3000
    depends_on:
      - api-gateway

  # ════════════════════════════════════════════════════════════
  # LOAD BALANCERS (Nginx — round-robin reverse proxies)
  # ════════════════════════════════════════════════════════════

  lb-manufacturer:
    image: nginx:alpine
    container_name: sideboard-lb-manufacturer
    restart: always
    volumes:
      - ./load-balancers/lb-manufacturer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sideboard-manufacturer-backend

  lb-shop:
    image: nginx:alpine
    container_name: sideboard-lb-shop
    restart: always
    volumes:
      - ./load-balancers/lb-shop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - shop-service

  lb-cart:
    image: nginx:alpine
    container_name: sideboard-lb-cart
    restart: always
    volumes:
      - ./load-balancers/lb-cart/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cart-service

  lb-configurator:
    image: nginx:alpine
    container_name: sideboard-lb-configurator
    restart: always
    volumes:
      - ./load-balancers/lb-configurator/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - configurator-service

  lb-media:
    image: nginx:alpine
    container_name: sideboard-lb-media
    restart: always
    volumes:
      - ./load-balancers/lb-media/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - media-service

  lb-ai:
    image: nginx:alpine
    container_name: sideboard-lb-ai
    restart: always
    volumes:
      - ./load-balancers/lb-ai/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ai-recommendation-service

  lb-community:
    image: nginx:alpine
    container_name: sideboard-lb-community
    restart: always
    volumes:
      - ./load-balancers/lb-community/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - community-feature-service

  # ════════════════════════════════════════════════════════════
  # FRONTEND  (Nginx — proxies /api/* to lb-manufacturer)
  # ════════════════════════════════════════════════════════════

  frontend:
    build: ./frontend
    container_name: sideboard-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - lb-manufacturer
      - minio

volumes:
  mysql_data:
  minio_data: